<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>一折健康助手</title>
<link rel="icon" href="static/favicon.svg" type="image/svg+xml">
<style>
:root{
  --paper:#faf6ef;
  --paper-2:#f3eddf;
  --card:#fffdf8;
  --ink:#33383a;
  --sub:#7b817a;
  --muted:#a9a390;
  --green:#2f6e5d;
  --green-2:#4c8b74;
  --green-soft:#e6efe7;
  --line:#e7ddca;
  --line-2:#d8ccb4;
  --accent:#c96f4a;
  --accent-soft:#f5e6db;
  --shadow:0 1px 4px rgba(96,84,60,.06), 0 10px 28px rgba(96,84,60,.08);
  --serif:'STSong','SimSun','Songti SC','Noto Serif SC',serif;
  --sans:'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:var(--sans);
  background:
    radial-gradient(900px 500px at 12% -6%, rgba(207,190,150,.14), transparent 60%),
    radial-gradient(700px 500px at 105% 8%, rgba(142,178,150,.12), transparent 55%),
    var(--paper);
  color:var(--ink);
  height:100vh;height:100dvh;display:flex;overflow:hidden;font-size:14px;
}
::selection{background:rgba(47,110,93,.18)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(120,108,84,.2);border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(47,110,93,.35);border:2px solid transparent;background-clip:content-box}

/* ── 侧边栏 ── */
#sidebar{
  width:248px;background:var(--paper-2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;flex-shrink:0;z-index:20;
  transition:margin-left .25s ease;
}
.brand{display:flex;align-items:center;gap:12px;padding:18px 18px 14px}
.brand .logo{
  width:38px;height:38px;border-radius:12px;background:var(--green);color:#f4efe4;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.brand .logo svg{width:20px;height:20px}
.brand .name{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:2px}
.brand .en{font-size:10px;color:var(--muted);margin-top:2px;letter-spacing:1.8px}
#new-btn{
  margin:2px 14px 12px;padding:10px 0;background:var(--green);color:#f4efe4;
  border:none;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;
  letter-spacing:1px;transition:background .2s;
}
#new-btn:hover{background:var(--green-2)}
#session-list{flex:1;overflow-y:auto;padding:0 10px}
.sess-group{font-size:11px;color:var(--muted);padding:12px 8px 5px;letter-spacing:2px}
.sess-item{
  display:flex;align-items:center;padding:10px 11px;border-radius:10px;cursor:pointer;
  font-size:13px;color:#5d625e;gap:7px;margin-bottom:3px;
  border-left:3px solid transparent;transition:background .15s,border-color .15s;
}
.sess-item:hover{background:rgba(255,255,255,.55)}
.sess-item.active{background:var(--green-soft);border-left-color:var(--green);color:var(--green);font-weight:600}
.sess-item .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess-item .del{
  visibility:hidden;color:var(--muted);border:none;background:none;cursor:pointer;
  font-size:15px;padding:0 3px;border-radius:5px;transition:color .15s;
}
.sess-item:hover .del{visibility:visible}
.sess-item .del:hover{color:var(--accent)}
#side-foot{
  padding:13px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);
  letter-spacing:1px;line-height:1.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#backdrop{display:none;position:fixed;inset:0;background:rgba(70,62,48,.28);z-index:15}
#backdrop.show{display:block}

/* ── 主区 ── */
#main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;z-index:1}
#topbar{background:rgba(250,246,239,.92);border-bottom:1px solid var(--line);height:56px;flex-shrink:0}
.topbar-inner{
  width:min(1500px, calc(100% - 48px));margin:0 auto;height:56px;
  display:flex;align-items:center;gap:12px;padding:0 18px;
}
#menu-btn{display:none;background:none;border:none;font-size:19px;cursor:pointer;color:var(--ink);padding:4px 8px;border-radius:8px}
#menu-btn:hover{background:rgba(47,110,93,.08)}
#cur-title{font-size:14px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.5px}
#status{
  display:flex;align-items:center;gap:7px;font-size:12px;color:var(--sub);
  padding:6px 13px;border:1px solid var(--line);border-radius:999px;background:var(--card);
}
#status .dot{width:7px;height:7px;border-radius:50%;background:#4c8b74}

#chat-box{
  flex:1;min-height:0;overflow-y:auto;padding:26px 20px 14px;
  width:min(1500px, calc(100% - 48px));margin:0 auto;
  scroll-behavior:smooth;display:flex;flex-direction:column;
}
.msg-row{display:flex;gap:12px;margin-bottom:20px;animation:msgIn .3s ease both}
.msg-row.user{justify-content:flex-end}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.avatar{
  width:34px;height:34px;border-radius:50%;background:var(--card);
  border:1px solid var(--line-2);color:var(--green);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  overflow:hidden;
}
.avatar img{width:30px !important;height:30px !important;max-width:none;object-fit:cover;border-radius:50%}
.msg-inner{max-width:min(74%, 900px);min-width:0}
.bubble{
  padding:12px 16px;border-radius:14px;line-height:1.8;word-break:break-word;white-space:pre-wrap;
  font-size:14.5px;
}
.msg-row.assistant .bubble{
  background:var(--card);border:1px solid var(--line);
  border-top-left-radius:5px;box-shadow:var(--shadow);
}
.msg-row.user .bubble{
  background:linear-gradient(135deg,#2f6e5d,#3d7c68);color:#f7f3e9;
  border-top-right-radius:5px;
}
.meta{font-size:11px;color:var(--muted);margin-top:5px;letter-spacing:.5px}
.msg-row.user .meta{text-align:right}
.typing{display:inline-flex;gap:5px;padding:4px 2px}
.typing i{width:6px;height:6px;background:var(--green);border-radius:50%;animation:blink 1.3s infinite}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}

/* 欢迎页 */
.welcome{text-align:center;margin:auto;animation:fadeUp .5s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.ai-hero{
  width:126px;height:126px;margin:0 auto 18px;position:relative;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;background:var(--card);border:1px solid var(--line);
  box-shadow:var(--shadow);
}
.ai-hero::after{
  content:"";position:absolute;inset:-10px;border-radius:50%;
  border:1px dashed var(--line-2);
}
.ai-hero .hero-face{width:112px !important;height:112px !important;max-width:none;border-radius:50%;object-fit:cover}
.welcome h2{font-family:var(--serif);font-size:23px;letter-spacing:3px;margin-bottom:6px;font-weight:600}
.welcome .hello-en{font-size:10.5px;color:var(--muted);letter-spacing:5px;margin-bottom:8px}
.welcome p{color:var(--sub);font-size:13.5px;margin-bottom:26px;letter-spacing:.5px}
.cards{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 18px;font-size:13px;color:#5d625e;cursor:pointer;
  transition:all .18s;
}
.card:hover{
  border-color:var(--green-2);color:var(--green);transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(96,84,60,.1);
}

/* 输入区 */
#input-wrap{padding:6px 20px 14px;width:min(1500px, calc(100% - 48px));margin:0 auto}
#input-row{
  display:flex;gap:10px;align-items:center;
  padding:8px 8px 8px 16px;border-radius:14px;
  background:var(--card);border:1.5px solid var(--line-2);
  box-shadow:var(--shadow);transition:border-color .2s;
}
#input-row:focus-within{border-color:var(--green)}
#q{
  flex:1;padding:11px 4px;font-size:14.5px;border:none;outline:none;
  background:transparent;color:var(--ink);
}
#q::placeholder{color:var(--muted)}
#send{
  padding:11px 26px;background:var(--green);color:#f7f3e9;border:none;border-radius:10px;
  font-size:14px;font-weight:600;cursor:pointer;flex-shrink:0;letter-spacing:1px;
  transition:background .2s;
}
#send:hover{background:var(--green-2)}
#send:disabled{opacity:.45;cursor:not-allowed}
#disclaimer{font-size:11px;color:var(--muted);text-align:center;padding:9px 0 2px;letter-spacing:.5px}

@media (max-width:760px){
  #sidebar{
    position:absolute;left:0;top:0;bottom:0;margin-left:-248px;
    box-shadow:2px 0 18px rgba(60,50,35,.18);
    padding-bottom:env(safe-area-inset-bottom);
  }
  #sidebar.open{margin-left:0}
  #menu-btn{display:block}
  #chat-box,#input-wrap,.topbar-inner{width:100%}
  #chat-box{padding:18px 14px 8px}
  #input-wrap{padding:6px 12px calc(10px + env(safe-area-inset-bottom))}
  #disclaimer{padding:6px 0 2px}
  #q{font-size:16px}
  .cards{flex-direction:column;width:100%;max-width:320px;margin:0 auto}
  .card{width:100%;text-align:center}
  .msg-inner{max-width:86%}
  .bubble{font-size:15px}
  .ai-hero{width:104px;height:104px}
  .ai-hero .hero-face{width:92px !important;height:92px !important}
  .welcome h2{font-size:20px}
  #topbar{height:52px}
  .topbar-inner{height:52px;padding:0 12px}
}
@media (max-width:360px){
  .ai-hero{width:88px;height:88px}
  .ai-hero .hero-face{width:78px !important;height:78px !important}
}
</style>
</head>
<body>
    <aside id="sidebar">
        <div class="brand">
            <div class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/></svg></div>
            <div>
                <div class="name">一折健康助手</div>
                <div class="en">AI HEALTH ASSISTANT</div>
            </div>
        </div>
        <button id="new-btn">＋ 新建对话</button>
        <div id="session-list"></div>
        <div id="side-foot">v2.0 · 智能导诊 · 健康科普</div>
    </aside>
    <div id="backdrop"></div>
    <div id="main">
        <div id="topbar">
            <div class="topbar-inner">
                <button id="menu-btn">☰</button>
                <div id="cur-title">新对话</div>
                <div id="status"><span class="dot"></span><span id="status-text">连接中…</span></div>
            </div>
        </div>
        <div id="chat-box"></div>
        <div id="input-wrap">
            <div id="input-row">
                <input id="q" placeholder="描述你的症状或健康疑问…" autofocus />
                <button id="send">发送</button>
            </div>
            <div id="disclaimer">内容由 AI 生成，仅供参考，不构成医疗建议。如有不适请及时就医。</div>
        </div>
    </div>

    <script>
    var ICON = '<img src="static/avatar.png" width="30" height="30" alt="">';
    var LS_KEY = 'yz_sessions', CUR_KEY = 'yz_current';
    var currentId = localStorage.getItem(CUR_KEY) || null;
    var box = document.getElementById('chat-box');

    function loadSessions() {
        try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; } catch (e) { return []; }
    }
    function saveSessions(list) { localStorage.setItem(LS_KEY, JSON.stringify(list)); }
    function getSession(id) {
        var list = loadSessions();
        for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
        return null;
    }
    function upsertSession(sess) {
        var list = loadSessions();
        for (var i = 0; i < list.length; i++) {
            if (list[i].id === sess.id) { list[i] = sess; saveSessions(list); return; }
        }
        list.unshift(sess);
        if (list.length > 50) list = list.slice(0, 50);
        saveSessions(list);
    }
    function removeSession(id) {
        var list = loadSessions().filter(function (s) { return s.id !== id; });
        saveSessions(list);
        if (currentId === id) newSession();
    }
    function fmtTime(ts) {
        var d = new Date(ts), p = function (n) { return n < 10 ? '0' + n : '' + n; };
        return p(d.getHours()) + ':' + p(d.getMinutes());
    }
    function fmtDate(ts) {
        var d = new Date(ts), now = new Date();
        if (d.toDateString() === now.toDateString()) return '今天';
        var y = new Date(now.getTime() - 86400000);
        if (d.toDateString() === y.toDateString()) return '昨天';
        return (d.getMonth() + 1) + '月' + d.getDate() + '日';
    }
    function scrollBox() { box.scrollTop = box.scrollHeight; }

    function renderSidebar() {
        var list = loadSessions(), el = document.getElementById('session-list');
        el.innerHTML = '';
        if (list.length === 0) {
            el.innerHTML = '<div class="sess-group">暂无历史会话</div>';
            return;
        }
        var groups = {};
        list.forEach(function (s) {
            var k = fmtDate(s.time);
            if (!groups[k]) groups[k] = [];
            groups[k].push(s);
        });
        Object.keys(groups).forEach(function (g) {
            var gd = document.createElement('div');
            gd.className = 'sess-group';
            gd.textContent = g;
            el.appendChild(gd);
            groups[g].forEach(function (s) {
                var item = document.createElement('div');
                item.className = 'sess-item' + (s.id === currentId ? ' active' : '');
                var t = document.createElement('span');
                t.className = 't';
                t.textContent = s.title || '新对话';
                var d = document.createElement('button');
                d.className = 'del';
                d.textContent = '×';
                d.title = '删除会话';
                d.addEventListener('click', function (e) {
                    e.stopPropagation();
                    removeSession(s.id);
                    renderSidebar();
                });
                item.appendChild(t);
                item.appendChild(d);
                item.addEventListener('click', function () {
                    currentId = s.id;
                    localStorage.setItem(CUR_KEY, currentId);
                    renderSession();
                    renderSidebar();
                    closeSidebar();
                });
                el.appendChild(item);
            });
        });
    }

    function addMsgRow(role, text, ts) {
        var row = document.createElement('div');
        row.className = 'msg-row ' + role;
        var inner = '';
        if (role === 'assistant') inner = '<div class="avatar">' + ICON + '</div>';
        inner += '<div class="msg-inner"><div class="bubble"></div><div class="meta">' + fmtTime(ts || Date.now()) + '</div></div>';
        row.innerHTML = inner;
        row.querySelector('.bubble').textContent = text;
        box.appendChild(row);
        scrollBox();
        return row;
    }
    function showWelcome() {
        var w = document.createElement('div');
        w.className = 'welcome';
        w.innerHTML = '<div class="ai-hero"><img class="hero-face" src="static/avatar.png" width="112" height="112" alt="一折"></div>' +
            '<div class="hello-en">见字如面 · 慢慢说</div><h2>你好，我是一折</h2>' +
            '<p>日常养生、饮食调理、小病小痛怎么就诊，都可以问我</p>' +
            '<div class="cards">' +
            '<div class="card" data-q="感冒了应该注意什么">感冒了应该注意什么</div>' +
            '<div class="card" data-q="头痛应该挂哪个科室">头痛挂什么科室</div>' +
            '<div class="card" data-q="经常熬夜怎么调理">经常熬夜怎么调理</div>' +
            '</div>';
        box.appendChild(w);
        var cards = w.querySelectorAll('.card');
        for (var i = 0; i < cards.length; i++) {
            cards[i].addEventListener('click', function () { ask(this.getAttribute('data-q')); });
        }
        scrollBox();
    }

    function renderSession() {
        box.innerHTML = '';
        var s = getSession(currentId);
        document.getElementById('cur-title').textContent = (s && s.title) || '新对话';
        if (!s || !s.msgs || s.msgs.length === 0) { showWelcome(); return; }
        s.msgs.forEach(function (m) { addMsgRow(m.role, m.text, m.time); });
    }

    function newSession() {
        currentId = 's' + Date.now();
        localStorage.setItem(CUR_KEY, currentId);
        renderSession();
        renderSidebar();
        document.getElementById('q').focus();
    }

    function appendMsg(role, text) {
        var s = getSession(currentId);
        if (!s) { s = { id: currentId, title: '', time: Date.now(), msgs: [] }; }
        s.msgs.push({ role: role, text: text, time: Date.now() });
        s.time = Date.now();
        if (!s.title && role === 'user') s.title = text.slice(0, 14);
        upsertSession(s);
    }

    async function ask(q) {
        var text = (typeof q === 'string') ? q.trim() : document.getElementById('q').value.trim();
        if (!text) return;
        if (!getSession(currentId)) upsertSession({ id: currentId, title: text.slice(0, 14), time: Date.now(), msgs: [] });
        document.getElementById('q').value = '';
        addMsgRow('user', text, Date.now());
        appendMsg('user', text);
        renderSidebar();
        var send = document.getElementById('send');
        send.disabled = true;
        var typing = document.createElement('div');
        typing.className = 'msg-row assistant';
        typing.innerHTML = '<div class="avatar">' + ICON + '</div><div class="msg-inner"><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div></div>';
        box.appendChild(typing);
        scrollBox();
        var first = true, bubbleEl = null, fullText = '';
        try {
            var res = await fetch('api/chat/rag/stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: text, session_id: currentId })
            });
            var reader = res.body.getReader();
            var decoder = new TextDecoder();
            while (true) {
                var chunk = await reader.read();
                if (chunk.done) break;
                var piece = decoder.decode(chunk.value, { stream: true });
                if (first) {
                    first = false;
                    typing.remove();
                    var row = addMsgRow('assistant', '', Date.now());
                    bubbleEl = row.querySelector('.bubble');
                }
                fullText += piece;
                if (bubbleEl) bubbleEl.textContent = fullText;
                scrollBox();
            }
            if (first) { typing.remove(); }
        } catch (e) {
            typing.remove();
        }
        send.disabled = false;
        if (fullText) appendMsg('assistant', fullText);
        renderSidebar();
    }

    var backdrop = document.getElementById('backdrop');
    function openSidebar() {
        document.getElementById('sidebar').classList.add('open');
        backdrop.classList.add('show');
    }
    function closeSidebar() {
        document.getElementById('sidebar').classList.remove('open');
        backdrop.classList.remove('show');
    }
    document.getElementById('new-btn').addEventListener('click', function () {
        newSession();
        closeSidebar();
    });
    document.getElementById('send').addEventListener('click', function () { ask(); });
    document.getElementById('q').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') ask();
    });
    document.getElementById('menu-btn').addEventListener('click', function () {
        var sb = document.getElementById('sidebar');
        if (sb.classList.contains('open')) { closeSidebar(); } else { openSidebar(); }
    });
    backdrop.addEventListener('click', closeSidebar);
    window.addEventListener('resize', closeSidebar);
    fetch('healthz').then(function (r) {
        if (r.ok) document.getElementById('status-text').textContent = '服务正常';
        else document.getElementById('status-text').textContent = '服务异常';
    }).catch(function () {
        document.getElementById('status-text').textContent = '服务异常';
    });

    if (currentId && getSession(currentId)) { renderSession(); }
    else { newSession(); }
    renderSidebar();
    </script>
</body>
</html>
